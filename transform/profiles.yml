# Default target `ci`: local DuckDB, needs no account or secret.
# `databricks` and `motherduck` are used for the cloud probe (.github/workflows/probe.yml) and the
# real gold; every sensitive value is read from environment variables, never written in this file.
# The two DuckDB targets pin the session time zone to UTC (Spark writes created_at in UTC); staging
# also normalizes to UTC, so results do not depend on the machine's time zone.
repopulse:
  target: ci
  outputs:
    ci:
      type: duckdb
      path: ci.duckdb  # relative to the directory the command runs in (repo root); *.duckdb is gitignored
      threads: 2
      settings:
        TimeZone: UTC

    # Needs `pip install -e ".[dbt,databricks]"`. DATABRICKS_HOST may include `https://`; it is stripped here.
    # The probe only runs `dbt debug` with the default schema `repopulse_probe`. The real gold
    # (.github/workflows/dbt-databricks.yml, docs/dbt-databricks.md) sets DBT_DATABRICKS_SCHEMA
    # (empty also falls back to the default): dbt composes `<schema>`, `<schema>_staging`,
    # `<schema>_gold`..., and never touches the `repopulse` schema that holds the bronze/silver
    # tables of the Databricks job (D1).
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') | replace('https://', '') | replace('http://', '') | trim('/') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: workspace
      schema: "{{ env_var('DBT_DATABRICKS_SCHEMA', '') or 'repopulse_probe' }}"
      threads: 2

    # duckdb reads the token from the MOTHERDUCK_TOKEN environment variable itself; never embed the
    # token in the path. MOTHERDUCK_DATABASE defaults to `repopulse` (the real gold), even when the
    # variable is set but empty (`or`); the PR smoke step sets `repopulse_smoke`.
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'repopulse') or 'repopulse' }}"
      threads: 2
      settings:
        TimeZone: UTC

    # Snowflake port (docs/snowflake-port.md). Needs `pip install -e ".[dbt,snowflake]"`. Only runs
    # in .github/workflows/snowflake-port.yml. The SERVICE user logs in with a key pair: private_key
    # is a PKCS#8 PEM without a passphrase, read from an environment variable; there is no password.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', '') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', '') }}"
      schema: repopulse
      threads: 4
      client_session_keep_alive: false
      query_tag: repopulse-snowflake-port
