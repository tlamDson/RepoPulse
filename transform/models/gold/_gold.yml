version: 2

models:
  - name: dim_repo
    description: >
      One row per data-ecosystem repo of the seed repos_data_ecosystem. repo_key is the lower-cased
      repo_name: events match it case-insensitively, as the baseline queries do.
    config:
      contract:
        enforced: true
    columns:
      - name: repo_key
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: repo_name
        description: Seed spelling (owner/name), the name reported by the marts.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: category
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - compute
                  - orchestration
                  - storage-format
                  - warehouse
                  - streaming
                  - dataframe
                  - bi

  - name: dim_user
    description: >
      SCD2 per actor_id built from event history (gaps-and-islands, deterministic, no dbt
      snapshot): a new version starts whenever actor_login differs from the previous event of
      the same actor_id (order created_at, event_id). valid_from = first event of the version,
      valid_to = valid_from of the next version (half-open), NULL for the current version.
    config:
      contract:
        enforced: true
    columns:
      - name: user_key
        description: "'<actor_id>-<version_number>'"
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: actor_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: actor_login
        data_type: varchar
      - name: version_number
        data_type: bigint
        constraints:
          - type: not_null
      - name: valid_from
        data_type: timestamp
        constraints:
          - type: not_null
      - name: valid_to
        data_type: timestamp
      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null
      - name: is_bot
        description: Login ends with '[bot]' or '-bot', case-insensitive (benchmarks/queries/q1.sql).
        data_type: boolean
        constraints:
          - type: not_null

  - name: fct_events
    description: >
      One row per GH Archive event on a seed repo (grain event_id). user_key points at the
      dim_user version valid at created_at; repo_key at dim_repo. Commit author email/name
      hashes from silver are not carried into gold.
    config:
      contract:
        enforced: true
    columns:
      - name: event_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: event_type
        data_type: varchar
        constraints:
          - type: not_null
      - name: action
        data_type: varchar
      - name: created_at
        data_type: timestamp
        constraints:
          - type: not_null
      - name: event_date
        data_type: date
        constraints:
          - type: not_null
      - name: event_week
        description: ISO week (Monday start) of created_at.
        data_type: date
        constraints:
          - type: not_null
      - name: user_key
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
      - name: actor_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: repo_key
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_repo')
                field: repo_key
      - name: repo_id
        data_type: bigint
      - name: pr_number
        data_type: bigint
      - name: issue_number
        data_type: bigint
      - name: item_number
        description: coalesce(pr_number, issue_number), the issue/PR number used by Q4 and Q6.
        data_type: bigint
      - name: pr_merged
        data_type: boolean
      - name: is_late
        data_type: boolean

unit_tests:
  - name: dim_user_login_change_starts_new_version
    description: A rename yields 2 versions with touching, non-overlapping validity; bots flagged.
    model: dim_user
    given:
      - input: ref('stg_gharchive_events')
        rows:
          - {event_id: "1", actor_id: 1, actor_login: old, created_at: "2026-01-01 10:00:00"}
          - {event_id: "2", actor_id: 1, actor_login: old, created_at: "2026-01-02 10:00:00"}
          - {event_id: "3", actor_id: 1, actor_login: new, created_at: "2026-01-03 10:00:00"}
          - {event_id: "4", actor_id: 1, actor_login: new, created_at: "2026-01-04 10:00:00"}
          - {event_id: "5", actor_id: 2, actor_login: Build-Bot, created_at: "2026-01-02 12:00:00"}
    expect:
      rows:
        - {user_key: "1-1", actor_id: 1, actor_login: old, version_number: 1,
           valid_from: "2026-01-01 10:00:00", valid_to: "2026-01-03 10:00:00",
           is_current: false, is_bot: false}
        - {user_key: "1-2", actor_id: 1, actor_login: new, version_number: 2,
           valid_from: "2026-01-03 10:00:00", valid_to: null, is_current: true, is_bot: false}
        - {user_key: "2-1", actor_id: 2, actor_login: Build-Bot, version_number: 1,
           valid_from: "2026-01-02 12:00:00", valid_to: null, is_current: true, is_bot: true}

  - name: dim_user_login_change_back_is_a_third_version
    description: >
      a -> b -> a gives 3 versions (islands, not distinct logins); input order does not matter,
      ties on created_at are broken by event_id.
    model: dim_user
    given:
      - input: ref('stg_gharchive_events')
        rows:
          - {event_id: "13", actor_id: 7, actor_login: a, created_at: "2026-01-05 00:00:00"}
          - {event_id: "11", actor_id: 7, actor_login: a, created_at: "2026-01-01 00:00:00"}
          - {event_id: "12", actor_id: 7, actor_login: b, created_at: "2026-01-03 00:00:00"}
          - {event_id: "14", actor_id: 7, actor_login: a, created_at: "2026-01-05 00:00:00"}
    expect:
      rows:
        - {user_key: "7-1", actor_login: a, valid_from: "2026-01-01 00:00:00",
           valid_to: "2026-01-03 00:00:00", is_current: false}
        - {user_key: "7-2", actor_login: b, valid_from: "2026-01-03 00:00:00",
           valid_to: "2026-01-05 00:00:00", is_current: false}
        - {user_key: "7-3", actor_login: a, valid_from: "2026-01-05 00:00:00",
           valid_to: null, is_current: true}
