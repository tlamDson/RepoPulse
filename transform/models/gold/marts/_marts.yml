version: 2

# Q1-Q6 marts. Column names, meaning and results are those of benchmarks/queries/qN.sql (the
# definitions live there); tests/test_dbt_marts.py compares each mart with its query, row by row.
# Actors are identified by the login of the dim_user version valid at the event, like the
# baseline's actor.login.
# meta.pii: every mart column is an aggregate or a repo/category name, so pii: none
# (transform/governance.yml, docs/governance.md).

models:
  - name: mart_daily_active_contributors
    description: Q1 (q1.sql). Active human contributors per day and ISO week, per repo and category, new vs returning.
    config:
      contract:
        enforced: true
    columns:
      - name: period
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: [day, week]
      - name: period_start
        config: {meta: {pii: none}}
        data_type: date
        constraints:
          - type: not_null
      - name: scope
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: [repo, category]
      - name: scope_key
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
      - name: active_contributors
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: new_contributors
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: returning_contributors
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null

  - name: mart_cohort_retention
    description: Q2 (q2.sql). Cohort = ISO week of the first human PR opened on a seed repo; retained at exactly W+4 / W+12.
    config:
      contract:
        enforced: true
    columns:
      - name: cohort_week
        config: {meta: {pii: none}}
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: cohort_size
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: retained_w4
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: retained_w12
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: retention_w4_pct
        config: {meta: {pii: none}}
        data_type: double
      - name: retention_w12_pct
        config: {meta: {pii: none}}
        data_type: double

  - name: mart_contribution_funnel
    description: Q3 (q3.sql). Fork -> PR opened -> PR merged per repo; hours to first merge p50/p90.
    config:
      contract:
        enforced: true
    columns:
      - name: repo_name
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_repo')
                field: repo_name
      - name: category
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
      - name: forkers
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: forkers_with_pr
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: forkers_with_merge
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: prs_opened
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: prs_merged
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: merge_hours_p50
        config: {meta: {pii: none}}
        data_type: double
      - name: merge_hours_p90
        config: {meta: {pii: none}}
        data_type: double

  - name: mart_responsiveness
    description: Q4 (q4.sql). First human response time p50/p90 and close rate per repo and item type.
    config:
      contract:
        enforced: true
    columns:
      - name: repo_name
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
      - name: item_type
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: [issue, pull_request]
      - name: opened
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: responded
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: response_hours_p50
        config: {meta: {pii: none}}
        data_type: double
      - name: response_hours_p90
        config: {meta: {pii: none}}
        data_type: double
      - name: closed
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: close_rate_pct
        config: {meta: {pii: none}}
        data_type: double

  - name: mart_repo_concentration
    description: Q5 (q5.sql). Bus factor (top-N human share) and bot share per repo.
    config:
      contract:
        enforced: true
    columns:
      - name: repo_name
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: category
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
      - name: contributions
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: bot_contributions
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: bot_share_pct
        config: {meta: {pii: none}}
        data_type: double
      - name: human_contributors
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
      - name: top1_share_pct
        config: {meta: {pii: none}}
        data_type: double
      - name: top2_share_pct
        config: {meta: {pii: none}}
        data_type: double
      - name: top3_share_pct
        config: {meta: {pii: none}}
        data_type: double

  - name: mart_repo_health_score
    description: >
      Q6 (q6.sql). Health score per repo from Q1-Q5 components; the formula is documented in
      benchmarks/queries/q6.sql and docs/dbt-models.md.
    config:
      contract:
        enforced: true
    columns:
      - name: health_rank
        config: {meta: {pii: none}}
        data_type: bigint
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: repo_name
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: category
        config: {meta: {pii: none}}
        data_type: string
        constraints:
          - type: not_null
      - name: activity_score
        config: {meta: {pii: none}}
        data_type: double
      - name: retention_score
        config: {meta: {pii: none}}
        data_type: double
      - name: merge_score
        config: {meta: {pii: none}}
        data_type: double
      - name: response_score
        config: {meta: {pii: none}}
        data_type: double
      - name: close_score
        config: {meta: {pii: none}}
        data_type: double
      - name: diversity_score
        config: {meta: {pii: none}}
        data_type: double
      - name: health_score
        config: {meta: {pii: none}}
        data_type: double

unit_tests:
  - name: cohort_is_first_pr_week_and_retention_is_exact_w4_w12
    description: >
      Cohort = week of the first human PR opened (a later PR does not move it); retained only
      when active in exactly W+4 / W+12 (W+5 does not count); bots and actors without a PR are
      not in any cohort.
    model: mart_cohort_retention
    given:
      - input: ref('int_events_enriched')
        rows:
          - {actor_login: alice, is_bot: false, event_type: PullRequestEvent, action: opened, event_week: "2026-01-05"}
          - {actor_login: alice, is_bot: false, event_type: PullRequestEvent, action: opened, event_week: "2026-01-12"}
          - {actor_login: alice, is_bot: false, event_type: IssueCommentEvent, action: created, event_week: "2026-02-02"}
          - {actor_login: bob, is_bot: false, event_type: PullRequestEvent, action: opened, event_week: "2026-01-05"}
          - {actor_login: bob, is_bot: false, event_type: IssuesEvent, action: opened, event_week: "2026-03-30"}
          - {actor_login: carol, is_bot: false, event_type: PullRequestEvent, action: opened, event_week: "2026-01-12"}
          - {actor_login: carol, is_bot: false, event_type: IssueCommentEvent, action: created, event_week: "2026-02-16"}
          - {actor_login: carol, is_bot: false, event_type: ForkEvent, action: forked, event_week: "2026-02-09"}
          - {actor_login: "x[bot]", is_bot: true, event_type: PullRequestEvent, action: opened, event_week: "2026-01-05"}
          - {actor_login: dave, is_bot: false, event_type: IssueCommentEvent, action: created, event_week: "2026-01-05"}
    expect:
      rows:
        - {cohort_week: "2026-01-05", cohort_size: 2, retained_w4: 1, retained_w12: 1,
           retention_w4_pct: 50.0, retention_w12_pct: 50.0}
        - {cohort_week: "2026-01-12", cohort_size: 1, retained_w4: 0, retained_w12: 0,
           retention_w4_pct: 0.0, retention_w12_pct: 0.0}

  - name: funnel_counts_forkers_prs_and_merge_hours
    description: >
      u1 forks then opens #1 (merged 2 h later via action merged); u2 opened #2 before forking
      (counts as a PR, not as a forker with PR; merged 10 h later via closed + pr_merged); #3 never
      merged; the bot PR #4 is excluded; org/b has only a fork; org/c has no events and is absent.
      p50 = (2 + 10) / 2 = 6.0, p90 = 2 + 0.9 * 8 = 9.2.
    model: mart_contribution_funnel
    given:
      - input: ref('dim_repo')
        rows:
          - {repo_key: org/a, repo_name: org/a, category: compute}
          - {repo_key: org/b, repo_name: org/b, category: bi}
          - {repo_key: org/c, repo_name: org/c, category: bi}
      - input: ref('int_events_enriched')
        rows:
          - {repo_name: org/a, actor_login: u1, is_bot: false, event_type: ForkEvent, action: forked, created_at: "2026-01-01 00:00:00"}
          - {repo_name: org/a, actor_login: u1, is_bot: false, event_type: PullRequestEvent, action: opened, pr_number: 1, created_at: "2026-01-01 01:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: PullRequestEvent, action: merged, pr_number: 1, created_at: "2026-01-01 03:00:00"}
          - {repo_name: org/a, actor_login: u2, is_bot: false, event_type: ForkEvent, action: forked, created_at: "2026-01-01 00:00:00"}
          - {repo_name: org/a, actor_login: u2, is_bot: false, event_type: PullRequestEvent, action: opened, pr_number: 2, created_at: "2025-12-31 23:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: PullRequestEvent, action: closed, pr_number: 2, pr_merged: true, created_at: "2026-01-01 09:00:00"}
          - {repo_name: org/a, actor_login: u3, is_bot: false, event_type: PullRequestEvent, action: opened, pr_number: 3, created_at: "2026-01-02 00:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: PullRequestEvent, action: closed, pr_number: 3, pr_merged: false, created_at: "2026-01-02 05:00:00"}
          - {repo_name: org/a, actor_login: "x[bot]", is_bot: true, event_type: PullRequestEvent, action: opened, pr_number: 4, created_at: "2026-01-02 00:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: PullRequestEvent, action: merged, pr_number: 4, created_at: "2026-01-02 01:00:00"}
          - {repo_name: org/b, actor_login: u4, is_bot: false, event_type: ForkEvent, action: forked, created_at: "2026-01-03 00:00:00"}
    expect:
      rows:
        - {repo_name: org/a, category: compute, forkers: 2, forkers_with_pr: 1, forkers_with_merge: 1,
           prs_opened: 3, prs_merged: 2, merge_hours_p50: 6.0, merge_hours_p90: 9.2}
        - {repo_name: org/b, category: bi, forkers: 1, forkers_with_pr: 0, forkers_with_merge: 0,
           prs_opened: 0, prs_merged: 0, merge_hours_p50: null, merge_hours_p90: null}

  # The unit tests below (with the two above) also run on Databricks in
  # .github/workflows/dbt-databricks.yml: the same given/expect on both adapters is how the marts
  # are shown to give the same result on DuckDB and on a Databricks SQL warehouse (D2).

  - name: daily_active_contributors_new_vs_returning_per_day_week_repo_category
    description: >
      alice is new on org/a on Mon 01-05 and returning on 01-06 and in the next week; bob is new
      on org/b (same category); the bot and the fork are not contributions. The category row
      merges both repos.
    model: mart_daily_active_contributors
    given:
      - input: ref('int_events_enriched')
        rows:
          - {actor_login: alice, is_bot: false, repo_name: org/a, category: compute, event_type: PullRequestEvent, event_date: "2026-01-05", event_week: "2026-01-05"}
          - {actor_login: alice, is_bot: false, repo_name: org/a, category: compute, event_type: IssueCommentEvent, event_date: "2026-01-06", event_week: "2026-01-05"}
          - {actor_login: bob, is_bot: false, repo_name: org/b, category: compute, event_type: IssuesEvent, event_date: "2026-01-06", event_week: "2026-01-05"}
          - {actor_login: "x[bot]", is_bot: true, repo_name: org/a, category: compute, event_type: PullRequestReviewEvent, event_date: "2026-01-06", event_week: "2026-01-05"}
          - {actor_login: carol, is_bot: false, repo_name: org/a, category: compute, event_type: ForkEvent, event_date: "2026-01-06", event_week: "2026-01-05"}
          - {actor_login: alice, is_bot: false, repo_name: org/a, category: compute, event_type: PullRequestReviewCommentEvent, event_date: "2026-01-12", event_week: "2026-01-12"}
    expect:
      rows:
        - {period: day, period_start: "2026-01-05", scope: repo, scope_key: org/a, active_contributors: 1, new_contributors: 1, returning_contributors: 0}
        - {period: day, period_start: "2026-01-06", scope: repo, scope_key: org/a, active_contributors: 1, new_contributors: 0, returning_contributors: 1}
        - {period: day, period_start: "2026-01-12", scope: repo, scope_key: org/a, active_contributors: 1, new_contributors: 0, returning_contributors: 1}
        - {period: day, period_start: "2026-01-06", scope: repo, scope_key: org/b, active_contributors: 1, new_contributors: 1, returning_contributors: 0}
        - {period: week, period_start: "2026-01-05", scope: repo, scope_key: org/a, active_contributors: 1, new_contributors: 1, returning_contributors: 0}
        - {period: week, period_start: "2026-01-12", scope: repo, scope_key: org/a, active_contributors: 1, new_contributors: 0, returning_contributors: 1}
        - {period: week, period_start: "2026-01-05", scope: repo, scope_key: org/b, active_contributors: 1, new_contributors: 1, returning_contributors: 0}
        - {period: day, period_start: "2026-01-05", scope: category, scope_key: compute, active_contributors: 1, new_contributors: 1, returning_contributors: 0}
        - {period: day, period_start: "2026-01-06", scope: category, scope_key: compute, active_contributors: 2, new_contributors: 1, returning_contributors: 1}
        - {period: day, period_start: "2026-01-12", scope: category, scope_key: compute, active_contributors: 1, new_contributors: 0, returning_contributors: 1}
        - {period: week, period_start: "2026-01-05", scope: category, scope_key: compute, active_contributors: 2, new_contributors: 2, returning_contributors: 0}
        - {period: week, period_start: "2026-01-12", scope: category, scope_key: compute, active_contributors: 1, new_contributors: 0, returning_contributors: 1}

  - name: responsiveness_first_human_response_hours_and_close_rate
    description: >
      Issue #1: the bot and the opener's own comment do not count, u2 answers after 30 min, closed.
      Issue #2: answered after 2 h, open. Issue #3 has a bot opener and is left out. PR #10: a
      review after 36 s (0.01 h), then merged (closes it); PR #11 has no answer. Issue p50 =
      (0.5 + 2) / 2 = 1.25, p90 = 0.5 + 0.9 * 1.5 = 1.85.
    model: mart_responsiveness
    given:
      - input: ref('int_events_enriched')
        rows:
          - {repo_name: org/a, actor_login: u1, is_bot: false, event_type: IssuesEvent, action: opened, item_number: 1, created_at: "2026-01-01 00:00:00"}
          - {repo_name: org/a, actor_login: "x[bot]", is_bot: true, event_type: IssueCommentEvent, action: created, item_number: 1, created_at: "2026-01-01 00:05:00"}
          - {repo_name: org/a, actor_login: u1, is_bot: false, event_type: IssueCommentEvent, action: created, item_number: 1, created_at: "2026-01-01 00:10:00"}
          - {repo_name: org/a, actor_login: u2, is_bot: false, event_type: IssueCommentEvent, action: created, item_number: 1, created_at: "2026-01-01 00:30:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: IssuesEvent, action: closed, item_number: 1, created_at: "2026-01-01 12:00:00"}
          - {repo_name: org/a, actor_login: u3, is_bot: false, event_type: IssuesEvent, action: opened, item_number: 2, created_at: "2026-01-02 00:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: IssueCommentEvent, action: created, item_number: 2, created_at: "2026-01-02 02:00:00"}
          - {repo_name: org/a, actor_login: "x[bot]", is_bot: true, event_type: IssuesEvent, action: opened, item_number: 3, created_at: "2026-01-02 00:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: IssueCommentEvent, action: created, item_number: 3, created_at: "2026-01-02 01:00:00"}
          - {repo_name: org/a, actor_login: u1, is_bot: false, event_type: PullRequestEvent, action: opened, item_number: 10, created_at: "2026-01-03 00:00:00"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: PullRequestReviewEvent, action: created, item_number: 10, created_at: "2026-01-03 00:00:36"}
          - {repo_name: org/a, actor_login: m, is_bot: false, event_type: PullRequestEvent, action: merged, item_number: 10, created_at: "2026-01-03 05:00:00"}
          - {repo_name: org/a, actor_login: u2, is_bot: false, event_type: PullRequestEvent, action: opened, item_number: 11, created_at: "2026-01-04 00:00:00"}
    expect:
      rows:
        - {repo_name: org/a, item_type: issue, opened: 2, responded: 2, response_hours_p50: 1.25,
           response_hours_p90: 1.85, closed: 1, close_rate_pct: 50.0}
        - {repo_name: org/a, item_type: pull_request, opened: 2, responded: 1,
           response_hours_p50: 0.01, response_hours_p90: 0.01, closed: 1, close_rate_pct: 50.0}

  - name: repo_concentration_top_n_share_and_bot_share
    description: >
      org/a: u1 makes 3 of the 4 human contributions (top1 75 %), u2 the 4th, the bot 1 of 5
      (20 %); the fork is not a contribution. org/b has bot contributions only: no human share.
    model: mart_repo_concentration
    given:
      - input: ref('int_events_enriched')
        rows:
          - {repo_name: org/a, category: compute, actor_login: u1, is_bot: false, event_type: PullRequestEvent}
          - {repo_name: org/a, category: compute, actor_login: u1, is_bot: false, event_type: IssueCommentEvent}
          - {repo_name: org/a, category: compute, actor_login: u1, is_bot: false, event_type: IssuesEvent}
          - {repo_name: org/a, category: compute, actor_login: u2, is_bot: false, event_type: PullRequestReviewCommentEvent}
          - {repo_name: org/a, category: compute, actor_login: "x[bot]", is_bot: true, event_type: PullRequestReviewEvent}
          - {repo_name: org/a, category: compute, actor_login: u3, is_bot: false, event_type: ForkEvent}
          - {repo_name: org/b, category: bi, actor_login: "y[bot]", is_bot: true, event_type: IssueCommentEvent}
          - {repo_name: org/b, category: bi, actor_login: "y[bot]", is_bot: true, event_type: IssueCommentEvent}
    expect:
      rows:
        - {repo_name: org/a, category: compute, contributions: 5, bot_contributions: 1,
           bot_share_pct: 20.0, human_contributors: 2, top1_share_pct: 75.0,
           top2_share_pct: 100.0, top3_share_pct: 100.0}
        - {repo_name: org/b, category: bi, contributions: 2, bot_contributions: 2,
           bot_share_pct: 100.0, human_contributors: 0, top1_share_pct: null,
           top2_share_pct: null, top3_share_pct: null}

  - name: repo_health_score_components_weights_and_rank
    description: >
      org/a: 3 contributors (max, activity 1), 1 of 3 active in 2 weeks, its PR merged, 1 of 2
      items answered and closed, top1 share 0.5. Score = 100 * (0.25 + 0.15 / 3 + 0.15 + 0.20 *
      0.5 + 0.10 * 0.5 + 0.15 * 0.5) = 67.5. org/b: 1 contributor, one unanswered issue: 100 *
      0.25 / 3 = 8.33.
    model: mart_repo_health_score
    given:
      - input: ref('dim_repo')
        rows:
          - {repo_key: org/a, repo_name: org/a, category: compute}
          - {repo_key: org/b, repo_name: org/b, category: bi}
      - input: ref('int_events_enriched')
        rows:
          - {repo_name: org/a, actor_login: u1, is_bot: false, event_type: IssuesEvent, action: opened, item_number: 1, event_week: "2026-01-05", created_at: "2026-01-05 10:00:00"}
          - {repo_name: org/a, actor_login: u2, is_bot: false, event_type: IssueCommentEvent, action: created, item_number: 1, event_week: "2026-01-05", created_at: "2026-01-05 11:00:00"}
