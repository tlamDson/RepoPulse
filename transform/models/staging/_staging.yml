version: 2

# meta.pii on every column: class of transform/governance.yml (docs/governance.md).

# Silver Delta table written by the Databricks bronze/silver job (D1, docs/databricks-job.md):
# <catalog>.<schema>.silver_gharchive_events in Unity Catalog, default workspace.repopulse
# (repopulse/spark/tables.py). Read by stg_gharchive_events when the var silver_gharchive_source
# is unity_catalog (the default on target type databricks, docs/dbt-databricks.md).
sources:
  - name: silver
    description: Silver GH Archive events (real data, not simulated) in Unity Catalog.
    database: "{{ var('silver_gharchive_catalog', 'workspace') }}"
    schema: "{{ var('silver_gharchive_schema', 'repopulse') }}"
    tables:
      - name: silver_gharchive_events
        identifier: "{{ var('silver_gharchive_table', 'silver_gharchive_events') }}"
        description: >
          One row per event_id, columns of docs/spark-jobs.md; commit author emails/names are
          already salted SHA-256 hashes (repopulse/spark/pii.py).

models:
  - name: stg_gharchive_events
    description: >
      GH Archive events with the exact columns of silver/gharchive_events (docs/spark-jobs.md)
      plus the load marker loaded_at: one row per event_id. Incremental, accumulated across
      pipeline runs and never rebuilt by --full-refresh (full_refresh: false): a run inserts the
      event ids not staged yet, the copy already staged wins. Source chosen by vars:
      silver_gharchive_parquet set -> read_parquet('<glob>') (DuckDB only); else
      silver_gharchive_source unity_catalog -> source silver.silver_gharchive_events (default on
      Databricks); else the CI seed fixture_silver_gharchive_events (fixture, not a measurement).
    columns:
      - name: event_id
        config: {meta: {pii: none}}
        data_tests:
          - not_null
          - unique
      - name: event_type
        config: {meta: {pii: none}}
        data_tests:
          - not_null
      - name: created_at
        config: {meta: {pii: none}}
        data_tests:
          - not_null
      - name: event_date
        config: {meta: {pii: none}}
        data_tests:
          - not_null
      - name: actor_id
        config: {meta: {pii: public_identifier}}
        data_tests:
          - not_null
      - name: actor_login
        config: {meta: {pii: public_identifier}}
      - name: repo_id
        config: {meta: {pii: none}}
      - name: repo_name
        config: {meta: {pii: none}}
        data_tests:
          - not_null
      - name: action
        config: {meta: {pii: none}}
      - name: pr_number
        config: {meta: {pii: none}}
      - name: issue_number
        config: {meta: {pii: none}}
      - name: pr_merged
        config: {meta: {pii: none}}
      # Silver hashes commit author emails/names (repopulse/spark/pii.py). hashed_pii fails the
      # build, and so skips every model downstream, if a raw value got through.
      - name: commit_author_email_hashes
        config: {meta: {pii: hashed}}
        data_tests:
          - hashed_pii:
              arguments:
                is_array: true
      - name: commit_author_name_hashes
        config: {meta: {pii: hashed}}
        data_tests:
          - hashed_pii:
              arguments:
                is_array: true
      - name: landing_date
        config: {meta: {pii: none}}
      - name: landing_hour
        config: {meta: {pii: none}}
      - name: is_late
        config: {meta: {pii: none}}
      - name: loaded_at
        description: Start of the dbt run that inserted the row (run_started_at, UTC).
        config: {meta: {pii: none}}
        data_tests:
          - not_null
