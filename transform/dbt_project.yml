name: repopulse
version: "0.0.1"
config-version: 2
profile: repopulse

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Source of stg_gharchive_events (docs/dbt-models.md):
#   --vars '{silver_gharchive_parquet: "<glob>/*.parquet"}'  -> read_parquet('<glob>')
#   not set                                                  -> seed fixture_silver_gharchive_events
#
# Materialization (docs/dbt-models.md): stg_gharchive_events incremental (append new event ids,
# full_refresh: false), fct_events incremental (delete+insert, touched actors), dims and marts
# table. Changing the seed repos_data_ecosystem needs `--full-refresh` for gold.

models:
  repopulse:
    +materialized: view
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    gold:
      +schema: gold
      +materialized: table
