# Apache Kafka, 3 nodes in KRaft combined mode (broker + controller on each node): the
# metadata quorum is Kafka's own Raft, no external coordination service.
# Official image apache/kafka, version pinned (must equal KAFKA_IMAGE in
# benchmarks/streaming_bench.py). Used by .github/workflows/streaming.yml:
#
#   docker compose -f benchmarks/kafka/docker-compose.yml up -d --wait
#   docker compose -f benchmarks/kafka/docker-compose.yml down -v
#
# Listeners per node:
#   CONTROLLER  :9093   KRaft quorum, inside the compose network only
#   INTERNAL    :9092   broker <-> broker, advertised as <service>:9092
#   EXTERNAL    :X9092  the runner (producer, Spark), advertised as localhost:X9092
# Each broker is its own service without container_name, so a single broker can be stopped with
# `docker compose -f benchmarks/kafka/docker-compose.yml kill kafka-2` (fault tests, P2b).
# The image converts KAFKA_* variables into server.properties (KAFKA_FOO_BAR -> foo.bar); when
# any is set the image defaults are not used, so every required setting is listed here.

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: "broker,controller"
  CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_MESSAGE_MAX_BYTES: "10485760"
  KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
  KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
  KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"

# The probe is a short-lived JVM: give it a small heap, not the broker's KAFKA_HEAP_OPTS.
x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
  interval: 10s
  timeout: 30s
  retries: 18
  start_period: 20s

services:
  kafka-1:
    image: apache/kafka:4.0.0
    hostname: kafka-1
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092"
    healthcheck: *healthcheck

  kafka-2:
    image: apache/kafka:4.0.0
    hostname: kafka-2
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092"
    healthcheck: *healthcheck

  kafka-3:
    image: apache/kafka:4.0.0
    hostname: kafka-3
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092"
    healthcheck: *healthcheck
