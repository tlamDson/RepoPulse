# Trino catalog "hive" for benchmarks/trino_bench.py: tables in the Hive Metastore, parquet on
# MinIO through Trino's native S3 file system (fs.s3.enabled, Trino 484 docs).
# The keys are the throwaway keys of the local stack, read from the container environment
# (benchmarks/trino/docker-compose.yml); they are not secrets.
connector.name=hive
hive.metastore.uri=thrift://metastore:9083
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
