name: Pipeline (scheduled)

# Hourly incremental batch (not streaming, not real-time): ingest GH Archive hour files ->
# PySpark + Delta bronze/silver -> export silver to parquet -> dbt build (incremental staging +
# fct_events, dims and marts rebuilt) -> one runs.csv row in the `pipeline-run-<run_id>` artifact.
# Merge that row into runs.csv with `python benchmarks/record_run.py <artifact csv>...`.
#
# Fallback path (docs/probe-result.md): Spark runs on this runner with a fresh lake per run, gold
# lives on MotherDuck. The silver of one run only holds that run's hours; the history accumulates
# in stg_gharchive_events on MotherDuck (docs/dbt-models.md). The lake itself is never uploaded.
#
# Triggers:
# - schedule (hourly, minute 23) and workflow_dispatch only run once this file is on `main`, the
#   default branch, i.e. after the next release. They write the `repopulse` database on
#   MotherDuck and need the repo secrets MOTHERDUCK_TOKEN and PII_HASH_SALT (checked first).
#   Each scheduled run takes the last 3 hours (now - 2h back), so an hour GH Archive publishes
#   late is picked up by a later run; staging keeps one row per event id.
# - pull_request (path-filtered; not a required check, so `paths:` is fine here unlike ci.yml):
#   one real hour against local DuckDB (target ci) with a fixed fake salt, built twice to prove
#   the re-run changes no row count. If MOTHERDUCK_TOKEN is available it also smoke-tests the
#   motherduck target on the separate `repopulse_smoke` database, never on `repopulse`.
#
# Concurrency: schedule and workflow_dispatch share one group (one MotherDuck writer at a time,
# queued, never cancelled); each pull request has its own group.
# Secrets only reach the steps that need them through `env:`; no step prints them.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "last data date YYYY-MM-DD (UTC); empty = now minus 2 hours"
        type: string
        default: ""
      hour:
        description: "last data hour 0..23 (UTC); needed with date"
        type: string
        default: ""
      hours:
        description: "consecutive hours ending at date/hour (1..6)"
        type: string
        default: "3"
      force:
        description: "re-download hours (the runner starts empty, so this rarely matters)"
        type: boolean
        default: false
      full_refresh:
        description: "dbt --full-refresh (rebuilds gold; staging keeps its history)"
        type: boolean
        default: false
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/pipeline.yml"
      - "repopulse/pipeline.py"
      - "repopulse/spark/export.py"
      - "repopulse/spark/job.py"
      - "repopulse/spark/batch.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pipeline-pr-{0}', github.event.pull_request.number) || 'pipeline-motherduck' }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Pipeline (ingest, Spark, dbt)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DBT_TARGET: ${{ github.event_name == 'pull_request' && 'ci' || 'motherduck' }}
      VARIANT: ${{ github.event_name == 'pull_request' && 'pipeline-pr-smoke' || 'pipeline-incremental' }}
      FULL_REFRESH: ${{ inputs.full_refresh && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets (schedule / dispatch)
        if: github.event_name != 'pull_request'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PII_HASH_SALT: ${{ secrets.PII_HASH_SALT }}
        run: |
          missing=""
          if [ -z "$MOTHERDUCK_TOKEN" ]; then missing="$missing MOTHERDUCK_TOKEN"; fi
          if [ -z "$PII_HASH_SALT" ]; then missing="$missing PII_HASH_SALT"; fi
          if [ -n "$missing" ]; then
            echo "::error::missing repo secret(s):$missing (the owner adds them)"
            exit 1
          fi

      - name: Detect MotherDuck token (pull request smoke)
        if: github.event_name == 'pull_request'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -n "$MOTHERDUCK_TOKEN" ]; then echo "HAS_MOTHERDUCK=true" >> "$GITHUB_ENV"; fi

      - name: Run timestamp
        run: echo "RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySpark 3.5 + Delta need Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # MotherDuck rejects a DuckDB client newer than it supports: same pin as probe.yml.
      - name: Install
        run: pip install -e ".[dev,spark,dbt]" "duckdb==1.5.6"

      - name: Ingest GH Archive
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_HOUR: ${{ inputs.hour }}
          INPUT_HOURS: ${{ inputs.hours || (github.event_name == 'pull_request' && '1' || '3') }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=(
            --landing-dir data/landing/gharchive
            --work-dir "$RUNNER_TEMP/gharchive-raw"
            --summary out/ingest-summary.json
            --hours "$INPUT_HOURS"
          )
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE" --hour "$INPUT_HOUR"); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          python -m repopulse.pipeline timed --name ingest --timings out/timings.json -- \
            python -m repopulse.ingest "${args[@]}"

      - name: Data window
        run: python -m repopulse.pipeline window --ingest-summary out/ingest-summary.json >> "$GITHUB_ENV"

      - name: Spark bronze/silver
        env:
          PII_HASH_SALT: ${{ github.event_name == 'pull_request' && 'not-a-secret-pr-salt' || secrets.PII_HASH_SALT }}
        run: |
          python -m repopulse.pipeline timed --name spark --timings out/timings.json -- \
            python -m repopulse.spark.job --source gharchive \
            --date "$DATA_DATE" --hour "$DATA_HOUR" --hours "$DATA_HOURS" \
            --landing-dir data/landing/gharchive --lake-dir data/lake \
            --summary out/spark-summary.json

      - name: Export silver to parquet
        run: |
          python -m repopulse.pipeline timed --name export --timings out/timings.json -- \
            python -m repopulse.spark.export --lake-dir data/lake --out data/silver-export \
            --summary out/export-summary.json

      # The public models mask identifiers with mask_pii (docs/governance.md): dbt needs the salt
      # silver was hashed with, and off target ci a missing PII_HASH_SALT is a compile error.
      - name: dbt build
        env:
          MOTHERDUCK_TOKEN: ${{ github.event_name != 'pull_request' && secrets.MOTHERDUCK_TOKEN || '' }}
          PII_HASH_SALT: ${{ github.event_name == 'pull_request' && 'not-a-secret-pr-salt' || secrets.PII_HASH_SALT }}
        run: |
          extra=()
          if [ "$FULL_REFRESH" = "true" ]; then extra+=(--full-refresh); fi
          python -m repopulse.pipeline timed --name dbt --timings out/timings.json -- \
            dbt build --project-dir transform --profiles-dir transform --target "$DBT_TARGET" \
            --vars '{silver_gharchive_parquet: "data/silver-export/*.parquet"}' \
            --exclude fixture_silver_gharchive_events "${extra[@]}"

      - name: Re-run changes no row count (pull request, DuckDB)
        if: github.event_name == 'pull_request'
        env:
          PII_HASH_SALT: not-a-secret-pr-salt
        run: |
          python -m repopulse.pipeline counts --database ci.duckdb --out out/counts-first.json
          dbt build --project-dir transform --profiles-dir transform --target ci \
            --vars '{silver_gharchive_parquet: "data/silver-export/*.parquet"}' \
            --exclude fixture_silver_gharchive_events
          python -m repopulse.pipeline counts --database ci.duckdb --out out/counts-second.json
          diff out/counts-first.json out/counts-second.json

      - name: MotherDuck smoke (pull request, repopulse_smoke only)
        if: github.event_name == 'pull_request' && env.HAS_MOTHERDUCK == 'true'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: repopulse_smoke
          PII_HASH_SALT: not-a-secret-pr-salt
        run: |
          python -m repopulse.pipeline md-reset --database repopulse_smoke
          dbt build --project-dir transform --profiles-dir transform --target motherduck \
            --vars '{silver_gharchive_parquet: "data/silver-export/*.parquet"}' \
            --exclude fixture_silver_gharchive_events
          python -m repopulse.pipeline counts --database md:repopulse_smoke \
            --out out/counts-md-first.json
          dbt build --project-dir transform --profiles-dir transform --target motherduck \
            --vars '{silver_gharchive_parquet: "data/silver-export/*.parquet"}' \
            --exclude fixture_silver_gharchive_events
          python -m repopulse.pipeline counts --database md:repopulse_smoke \
            --out out/counts-md-second.json
          diff out/counts-md-first.json out/counts-md-second.json

      - name: runs.csv row
        run: |
          python -m repopulse.pipeline row \
            --run-at "$RUN_AT" \
            --git-sha "$GITHUB_SHA" \
            --ingest-summary out/ingest-summary.json \
            --spark-summary out/spark-summary.json \
            --timings out/timings.json \
            --run-id "$GITHUB_RUN_ID" \
            --trigger "$GITHUB_EVENT_NAME" \
            --variant "$VARIANT" \
            --note "target=$DBT_TARGET" \
            --note "full_refresh=$FULL_REFRESH" \
            --out out/pipeline-row.csv

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Pipeline (incremental batch, target: \`$DBT_TARGET\`)"
            echo
            for f in out/pipeline-row.csv out/ingest-summary.json out/spark-summary.json \
                     out/export-summary.json out/timings.json; do
              if [ -f "$f" ]; then
                echo "\`$f\`"
                echo
                echo '```'
                cat "$f"
                echo '```'
              else
                echo "\`$f\`: not written (an earlier step failed)."
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-run-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
