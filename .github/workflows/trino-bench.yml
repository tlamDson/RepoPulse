name: Trino benchmark

# P2c: Q1-Q6 on Trino + Hive Metastore + MinIO (Docker Compose on the runner, never on the
# owner's machine) over the four parquet layouts of benchmarks/query_opt.py, on the reference day
# of benchmarks/reference.toml (real GH Archive data). 1 warm-up + 10 timed runs per layout,
# median row per layout in the runs.csv format (variant=trino-<layout>). The naive baseline is
# measured again first, on the same runner and commit, before the stack starts.
# Details: docs/trino-hive.md.
# Output: artifact `trino-bench` (out/baseline-row.csv, out/trino-rows.csv,
# out/trino-summary.md, out/trino-samples/). Merge it with `python benchmarks/record_run.py`.
# Not a required check, so `paths:` on pull_request is fine here (unlike ci.yml).

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/trino-bench.yml"
      - "benchmarks/trino_bench.py"
      - "benchmarks/trino/**"
      - "benchmarks/queries_trino/**"
      - "benchmarks/query_opt.py"

permissions:
  contents: read

concurrency:
  group: trino-bench-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  trino-bench:
    name: Trino benchmark (Hive Metastore + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Cache reference day
        uses: actions/cache@v4
        with:
          path: data/raw/gharchive
          key: gharchive-${{ hashFiles('benchmarks/reference.toml') }}

      - name: Download and verify reference files (stops on any checksum mismatch)
        run: python benchmarks/fetch_reference.py

      - name: Baseline on this runner and commit (before the stack starts)
        run: >-
          python benchmarks/naive_duckdb.py
          --runs 10
          --variant baseline
          --git-sha "$GIT_SHA"
          --out out/baseline-row.csv

      - name: Start MinIO, Hive Metastore and Trino
        run: docker compose -f benchmarks/trino/docker-compose.yml up -d --wait --wait-timeout 600

      - name: Trino benchmark
        run: >-
          python benchmarks/trino_bench.py
          --runs 10
          --git-sha "$GIT_SHA"
          --out out/trino-rows.csv
          --summary out/trino-summary.md
          --samples-dir out/trino-samples

      - name: Stack logs
        if: failure()
        run: docker compose -f benchmarks/trino/docker-compose.yml logs --no-color --timestamps

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Baseline row (same runner and commit)"
            echo
            if [ -f out/baseline-row.csv ]; then
              echo '```csv'
              cat out/baseline-row.csv
              echo '```'
            else
              echo "No baseline row (the run stopped before it)."
            fi
            echo
            if [ -f out/trino-summary.md ]; then
              cat out/trino-summary.md
            else
              echo "No Trino summary (the run stopped before it)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trino-bench
          path: |
            out/baseline-row.csv
            out/trino-rows.csv
            out/trino-summary.md
            out/trino-samples/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop the stack and remove its volumes
        if: always()
        run: docker compose -f benchmarks/trino/docker-compose.yml down -v
