name: Benchmark

# Runs the naive DuckDB baseline (or a later variant) on the fixed reference day in
# benchmarks/reference.toml: N runs, median row in the runs.csv format, uploaded as the
# `benchmark-row` artifact. Merge it into runs.csv with `python benchmarks/record_run.py`.
# Not a required check, so `paths:` on pull_request is fine here (unlike ci.yml).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "runs.csv variant name (^[a-z0-9][a-z0-9_-]*$)"
        type: string
        default: baseline
      runs:
        description: "number of runs; the median is recorded"
        type: string
        default: "5"
  pull_request:
    branches: [develop, main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
      - "transform/seeds/repos_data_ecosystem.csv"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (naive DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: ${{ inputs.variant || 'baseline' }}
      RUNS: ${{ inputs.runs || '5' }}
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Cache reference day
        uses: actions/cache@v6
        with:
          path: data/raw/gharchive
          key: gharchive-${{ hashFiles('benchmarks/reference.toml') }}

      - name: Download and verify reference files (stops on any checksum mismatch)
        run: python benchmarks/fetch_reference.py

      - name: Run benchmark
        run: >-
          python benchmarks/naive_duckdb.py
          --runs "$RUNS"
          --variant "$VARIANT"
          --git-sha "$GIT_SHA"
          --out out/benchmark-row.csv

      - name: Job summary
        run: |
          {
            echo "### Benchmark row (variant: \`$VARIANT\`, runs: $RUNS)"
            echo
            echo '```csv'
            cat out/benchmark-row.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-row
          path: out/benchmark-row.csv
          if-no-files-found: error
          retention-days: 90
