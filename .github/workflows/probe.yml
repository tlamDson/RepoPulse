name: Cloud probe

# Probe number 1 (docs/plan.md): can GitHub Actions control Databricks Free Edition
# (token, Volume, serverless job, SQL warehouse, dbt debug), or must the fallback path be used
# (runner + MotherDuck)? Result: the `probe-result` artifact (probe-result.json + probe-result.md)
# and the Job summary; only pass/fail/skipped, no measurements.
#
# Trigger:
# - workflow_dispatch only shows up in the Actions tab once this file exists on `main` (after a release).
# - So a `push` trigger limited to exactly the `docs/probe-result` branch is added to run it right in this PR.
#   Do not use `pull_request`. After the merge the branch is deleted, so the push trigger stops running.
#
# A missing secret makes the matching check `skipped`; the workflow stays green. Secrets enter only
# through `env:`; no step prints a value. The artifact has host/token/warehouse path masked before writing.

on:
  workflow_dispatch:
  push:
    branches: [docs/probe-result]

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Cloud probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # MotherDuck rejects DuckDB clients newer than its extension supports (first run:
      # "latest supported version is v1.5.6"), so duckdb is pinned to exactly that version for the probe.
      - name: Install
        run: pip install -e ".[dbt]" dbt-databricks "duckdb==1.5.6"

      - name: Run probe checks
        env:
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: >-
          python -m repopulse.probe
          --json-out probe-result.json
          --markdown-out probe-result.md
          --no-step-summary
          --github-env

      # PROBE_HTTP_PATH is written to $GITHUB_ENV by the step above (already ::add-mask::ed), taken from
      # DATABRICKS_HTTP_PATH or found automatically through the warehouses API.
      - name: dbt debug (Databricks)
        id: dbt_databricks
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != '' && env.PROBE_HTTP_PATH != ''
        continue-on-error: true
        env:
          DATABRICKS_HTTP_PATH: ${{ env.PROBE_HTTP_PATH }}
        run: dbt debug --project-dir transform --profiles-dir transform --target databricks

      - name: dbt debug (MotherDuck)
        id: dbt_motherduck
        if: env.MOTHERDUCK_TOKEN != ''
        continue-on-error: true
        run: dbt debug --project-dir transform --profiles-dir transform --target motherduck

      - name: Merge dbt debug outcomes into the report
        if: always()
        env:
          DBT_DATABRICKS_OUTCOME: ${{ steps.dbt_databricks.outcome }}
          DBT_MOTHERDUCK_OUTCOME: ${{ steps.dbt_motherduck.outcome }}
        run: >-
          python -m repopulse.probe merge-dbt
          --json probe-result.json
          --markdown-out probe-result.md
          --databricks "$DBT_DATABRICKS_OUTCOME"
          --motherduck "$DBT_MOTHERDUCK_OUTCOME"

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: |
            probe-result.json
            probe-result.md
          if-no-files-found: error
          retention-days: 30
