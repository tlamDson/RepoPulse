name: Streaming

# Streaming throughput on the reference day (benchmarks/reference.toml, real GH Archive data):
# Apache Kafka 3 brokers in KRaft mode (benchmarks/kafka/docker-compose.yml) -> Spark Structured
# Streaming (trigger availableNow) -> bronze Delta, for N = 1, 3, 6 topic partitions, each run
# reconciled against the line count of the source files (docs/streaming.md).
# Output: artifact `streaming-throughput` with out/streaming-rows.csv (runs.csv format, one row
# per matched N, variant streaming-throughput-p<N>) and out/streaming-summary.md. Merge it with
# `python benchmarks/record_run.py out/streaming-rows.csv`; this workflow never writes runs.csv.
# Not a required check, so `paths:` on pull_request is fine here (unlike ci.yml).

on:
  workflow_dispatch:
    inputs:
      partitions:
        description: "comma-separated topic partition counts"
        type: string
        default: "1,3,6"
      max_hours:
        description: "hours of the reference day to produce (1..24)"
        type: string
        default: "24"
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/streaming.yml"
      - "benchmarks/streaming*"
      - "benchmarks/kafka/**"
      - "repopulse/streaming/**"

permissions:
  contents: read

concurrency:
  group: streaming-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  streaming:
    name: Streaming throughput (Kafka + Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PARTITIONS: ${{ inputs.partitions || '1,3,6' }}
      MAX_HOURS: ${{ inputs.max_hours || '24' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -e ".[dev,spark,streaming]"

      - name: Cache reference day
        uses: actions/cache@v4
        with:
          path: data/raw/gharchive
          key: gharchive-${{ hashFiles('benchmarks/reference.toml') }}

      - name: Download and verify reference files (stops on any checksum mismatch)
        run: python benchmarks/fetch_reference.py

      - name: Start Kafka (3 brokers, KRaft)
        run: docker compose -f benchmarks/kafka/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Disk and memory before
        run: |
          df -h .
          free -m
          docker compose -f benchmarks/kafka/docker-compose.yml ps

      - name: Run benchmark
        run: >-
          python benchmarks/streaming_bench.py
          --bootstrap localhost:19092,localhost:29092,localhost:39092
          --partitions "$PARTITIONS"
          --max-hours "$MAX_HOURS"
          --git-sha "$GIT_SHA"
          --out out/streaming-rows.csv
          --summary out/streaming-summary.md

      - name: Broker logs (on failure)
        if: failure()
        run: docker compose -f benchmarks/kafka/docker-compose.yml logs --no-color --tail 300

      - name: Job summary
        if: always()
        run: |
          df -h .
          if [ -f out/streaming-summary.md ]; then
            cat out/streaming-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No streaming summary (the run stopped before the benchmark)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streaming-throughput
          path: |
            out/streaming-rows.csv
            out/streaming-summary.md
          if-no-files-found: warn
          retention-days: 90

      - name: Stop Kafka
        if: always()
        run: docker compose -f benchmarks/kafka/docker-compose.yml down -v
