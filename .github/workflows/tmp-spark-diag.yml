name: tmp Spark diag (to be removed before merge)

# Temporary: find out why the shared pytest SparkSession stalls after the fault-injection tests.
# Removed again in this pull request.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  diag:
    name: tmp diag ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all
            args: ""
          - label: no-rerun
            args: "--deselect tests/test_quality_faults_spark.py::test_rerun_of_the_same_hours_gives_the_same_findings"
          - label: faulted-only
            args: "--deselect tests/test_quality_faults_spark.py::test_rerun_of_the_same_hours_gives_the_same_findings --deselect tests/test_quality_faults_spark.py::test_clean_run_raises_no_false_alarm"
          - label: control
            args: "--deselect tests/test_quality_faults_spark.py"
    env:
      ARGS: ${{ matrix.args }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark,dbt]"
      - name: Spark tests in CI order, with a watchdog
        run: |
          set +e
          # shellcheck disable=SC2086
          pytest -v --durations=0 $ARGS \
            tests/test_quality_faults_spark.py tests/test_spark_app_events.py \
            tests/test_spark_export.py tests/test_spark_gharchive.py tests/test_spark_naive.py \
            > pytest.log 2>&1 &
          pid=$!
          for _ in $(seq 1 96); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 5
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::pytest still running after 480s"
            tail -n 40 pytest.log
            ps -ef | grep -E "python|java" | cut -c 1-300
            for j in $(pgrep java); do
              echo "== jstat $j"
              jstat -gcutil "$j" 1000 5
              echo "== jstack $j"
              jstack "$j" | head -n 600
            done
            kill -INT "$pid"
            sleep 20
            kill -9 "$pid" 2>/dev/null
            echo "== pytest.log tail"
            tail -n 150 pytest.log
            exit 1
          fi
          wait "$pid"
          code=$?
          tail -n 150 pytest.log
          exit "$code"
