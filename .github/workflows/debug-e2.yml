name: Debug E2 (temporary)

# TEMPORARY: finds which Spark test hangs in `Unit Tests` once the Iceberg runtime is loaded in the
# shared test session. Removed before this PR is ready.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: debug-e2-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug E2 (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: tail-only
            tests: >-
              tests/test_spark_cli.py tests/test_spark_export.py tests/test_spark_gharchive.py
              tests/test_spark_naive.py tests/test_spark_pii.py tests/test_spark_rules.py
          - label: format-then-tail
            tests: >-
              tests/test_format_bench_spark.py
              tests/test_spark_cli.py tests/test_spark_export.py tests/test_spark_gharchive.py
              tests/test_spark_naive.py tests/test_spark_pii.py tests/test_spark_rules.py
    env:
      TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark,dbt]"
      - name: pytest (verbose, thread dumps when a test hangs)
        run: |
          (
            for wait in 330 150 150; do
              sleep "$wait"
              echo "===== jstack after another ${wait}s ====="
              for pid in $(pgrep -f org.apache.spark.deploy.SparkSubmit); do
                jstack "$pid" || true
              done
            done
          ) &
          pytest -v -o faulthandler_timeout=200 $TESTS
