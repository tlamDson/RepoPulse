name: Debug E2 (temporary)

# TEMPORARY: the shared test JVM ran out of heap (-Xmx1g, full GC loop) once the Delta vs Iceberg
# tests joined the session. Prints GC stats and a live heap histogram while the Spark test files
# run in suite order. Removed before this PR is ready.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: debug-e2-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug E2 (heap)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      TESTS: >-
        tests/test_format_bench_spark.py tests/test_quality_faults_spark.py
        tests/test_spark_app_events.py
        tests/test_spark_cli.py tests/test_spark_export.py tests/test_spark_gharchive.py
        tests/test_spark_naive.py tests/test_spark_pii.py tests/test_spark_rules.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark,dbt]"
      - name: pytest (verbose, GC stats and heap histograms)
        run: |
          (
            for wait in 100 50 50 50 50 50 50 50 50 50; do
              sleep "$wait"
              echo "===== heap after another ${wait}s ====="
              for pid in $(pgrep -f org.apache.spark.deploy.SparkSubmit); do
                jstat -gc "$pid" || true
                jmap -histo:live "$pid" | head -n 45 || true
              done
            done
          ) &
          pytest -v -o faulthandler_timeout=200 $TESTS
