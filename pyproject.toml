[project]
name = "repopulse"
version = "0.0.1"
description = "Data platform that measures open-source project health from GitHub event data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "pre-commit>=3.8", "pyyaml>=6"]
dbt = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repopulse*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["repopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
